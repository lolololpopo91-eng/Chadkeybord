name: Build CHAD KEYBOARD

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project
        run: unzip -q CHAD_KEYBOARD_GITHUB_BUILD.zip -d project

      - name: Build APK
        run: gradle -p project/ChadKeyboardAndroid assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CHAD-KEYBOARD-APK
          path: project/ChadKeyboardAndroid/app/build/outputs/apk/debug/app-debug.apk
